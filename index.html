<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Wishlist TRH: Chapter 1</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      animation: fadeIn 2s ease;
    }

    button {
      background: #ff4b2b;
      border: none;
      border-radius: 30px;
      padding: 15px 40px;
      font-size: 18px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ff416c;
    }

    .spinner {
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #28a745;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    .checkmark:after {
      content: "✔";
      color: #fff;
      font-size: 40px;
    }

    h2 {
      animation: fadeIn 1.5s ease;
    }

    p {
      margin-top: 20px;
      font-style: italic;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>Wishlist TRH: Chapter 1</h1>
  <button onclick="carregar()">Steam</button>

  <script>
    function carregar() {
      document.body.innerHTML = "<h2>Loading...</h2><div class='spinner'></div>";
      setTimeout(() => {
        document.body.innerHTML = `
          <div class="checkmark"></div>
          <h2>Obrigado por colocar TRH na sua wishlist Steam.<br>
          Detextei o processo steam.exe e assim então,<br>
          Aparecerá na sua biblioteca Steam! Obrigado.</h2>
          <p>Atenciosamente<br>- Note</p>
        `;
      }, 2000);
    }
  </script>
</body>
</html>
